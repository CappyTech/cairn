name: release

# - push to main         -> build web, push server image to GHCR, deploy to edge
# - push a tag  v1.2.3    -> also build a signed .aab and upload to Google Play
on:
  push:
    branches: [main]
    tags: ['v*', '[0-9]*']   # v1.2.3 or bare 1.2.3

jobs:
  # ---------------------------------------------------------------- server ---
  server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true          # cache the Flutter SDK + pub packages between runs
      - run: flutter pub get
      - run: flutter build web --release

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cappytech/cairn-server:latest
            ghcr.io/cappytech/cairn-server:${{ github.sha }}

      - name: Deploy to edge over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EDGE_SSH_HOST }}
          username: ${{ secrets.EDGE_SSH_USER }}
          key: ${{ secrets.EDGE_SSH_KEY }}
          script: |
            cd /docker/cairn-server
            docker compose pull
            docker compose up -d
            docker image prune -f

  # --------------------------------------------------------------- android ---
  android:
    # Any tag that can trigger this workflow is a version tag (see the `on:`
    # filter above: `v1.2.3` or bare `1.2.3`), so match all tag refs — otherwise
    # a bare-semver tag deploys the server but silently skips the Android build.
    if: startsWith(github.ref, 'refs/tags/')   # only on version tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true          # cache the Flutter SDK + pub packages between runs
      - run: flutter pub get

      # Cache Gradle's dependency + wrapper caches so the .aab build reuses them.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restore upload keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/app/upload.jks
      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=upload.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # versionName comes from the tag (strip a leading "v"); versionCode is the
      # monotonic Actions run number (always increases — Play requires that).
      - name: Derive version from tag
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # --android-skip-build-dependency-validation silences the "Gradle/AGP/Kotlin
      # will soon be unsupported" warnings. The toolchain still builds fine; a
      # deliberate upgrade (Gradle 9 / AGP 9 / Kotlin 2.3) is tracked separately.
      - run: >-
          flutter build appbundle --release
          --build-name=$APP_VERSION
          --build-number=${{ github.run_number }}
          --android-skip-build-dependency-validation
          --dart-define=PB_URL=https://cairn.cappylabs.uk

      # Always attach the .aab to the run so it's downloadable, even if the Play
      # upload below is skipped/fails (e.g. before secrets are set).
      - name: Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: cairn-aab-${{ env.APP_VERSION }}
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        continue-on-error: true   # don't fail the build if Play isn't set up yet
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: uk.cappylabs.cairn
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          # Release notes shipped with each build — edit before tagging.
          whatsNewDirectory: distribution/whatsnew
