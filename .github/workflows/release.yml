name: release

# - push to main         -> build web, push server image to GHCR, deploy to edge
# - push a tag  v1.2.3    -> also build a signed .aab and upload to Google Play
on:
  push:
    branches: [main]
    tags: ['v*', '[0-9]*']   # v1.2.3 or bare 1.2.3

jobs:
  # ---------------------------------------------------------------- server ---
  server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter build web --release

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cappytech/cairn-server:latest
            ghcr.io/cappytech/cairn-server:${{ github.sha }}

      - name: Deploy to edge over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EDGE_SSH_HOST }}
          username: ${{ secrets.EDGE_SSH_USER }}
          key: ${{ secrets.EDGE_SSH_KEY }}
          script: |
            cd /docker/cairn-server
            docker compose pull
            docker compose up -d
            docker image prune -f

  # --------------------------------------------------------------- android ---
  android:
    if: startsWith(github.ref, 'refs/tags/v')   # only on version tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get

      - name: Restore upload keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/app/upload.jks
      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=upload.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - run: flutter build appbundle --release --dart-define=PB_URL=https://cairn.cappylabs.uk

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: uk.cappylabs.cairn
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
